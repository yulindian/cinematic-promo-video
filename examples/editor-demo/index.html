<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"headline","type":"string","label":"主标题","default":"从想法，到可编辑的画面"},{"id":"accent","type":"color","label":"强调色","default":"#a9bcff"},{"id":"scale","type":"number","label":"标题比例","default":1.1,"min":0.6,"max":1.4,"step":0.05}]'>
<head><meta charset="utf-8"><title>可编辑看板示例</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#101728;color:#f1f3ff;font-family:sans-serif}
#main{width:1920px;height:1080px;position:relative;overflow:hidden;padding:150px 130px;background:radial-gradient(ellipse at 80% 60%,#273b6c 0%,#101728 60%)}
.eyebrow{font-size:22px;letter-spacing:5px;color:var(--accent,#a9bcff)}h1{font-size:78px;line-height:1.3;margin:115px 0 40px;transform-origin:left center;scale:var(--scale,1.1)}p{font-size:33px;color:#c0cae0}.rule{height:3px;width:180px;background:var(--accent,#a9bcff);margin-top:70px}.footer{position:absolute;bottom:75px;font-size:20px;color:#9aaaca}
</style></head><body>
<div id="main" data-composition-id="main" data-width="1920" data-height="1080" data-duration="6">
<div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="6" data-track-index="0" data-track-kind="graphics">CINEMATIC PROMO · EDITOR DEMO</div>
<h1 id="headline" data-hf-id="headline" data-var-text="headline" class="clip" data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics">从想法，到可编辑的画面</h1>
<p id="description" data-hf-id="description" class="clip" data-start="0" data-duration="6" data-track-index="2" data-track-kind="graphics">改文字 · 调参数 · 在时间点留下意见</p>
<div id="rule" class="rule clip" data-start="0" data-duration="6" data-track-index="3" data-track-kind="graphics"></div>
<span id="footer" class="footer clip" data-start="0" data-duration="6" data-track-index="4" data-track-kind="graphics">独立看板测试工程 / 非视频制作任务</span>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});tl.to({},{duration:6});window.__timelines.main=tl;</script>
</body></html>
